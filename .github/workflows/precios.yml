name: Precios en vivo

on:
  schedule:
    # Cada 10 minutos en horario de bolsa (9:30–16:00 de Chile, en UTC según horario de verano o invierno).
    - cron: "*/10 12-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Traer el histórico publicado (no se guarda en el repositorio)
        run: curl -sfL -o site/historico.json "https://francovasquezpinuer.github.io/ranking-dividendos/historico.json" || echo "Sin histórico previo"
      - name: Descargar precios del día
        run: python3 scripts/precios.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

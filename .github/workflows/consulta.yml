name: Consulta puntual
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import sys, datetime; sys.path.insert(0, "scripts")
          from update import get_json, crumb
          crumb()
          for sym in ["HLAG.DE", "VAPORES.SN"]:
              r = get_json(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=5d&interval=1h")["chart"]["result"][0]
              q = r["indicators"]["quote"][0]; m = r["meta"]
              byday = {}
              for t, c in zip(r["timestamp"], q["close"]):
                  if c: byday.setdefault(datetime.datetime.utcfromtimestamp(t).strftime("%m-%d"), []).append(c)
              print(f"::notice::{sym} último {m.get('regularMarketPrice')} ({datetime.datetime.utcfromtimestamp(m['regularMarketTime']).strftime('%m-%d %H:%M')} UTC) | " + " ; ".join(f"{d}: cierre {v[-1]:.2f} min {min(v):.2f} max {max(v):.2f}" for d, v in byday.items()))
          P

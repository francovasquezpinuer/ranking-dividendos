name: consulta
on: push
jobs:
  q:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[consulta]')
    steps:
      - run: |
          python3 - <<'P' || true
          import json, urllib.request, datetime
          H={"User-Agent":"Mozilla/5.0"}
          out=[]
          for tk in ["SQM-B","CHILE","BSANTANDER","BCI","ITAUCL","FALABELLA","CENCOSUD","COPEC","CMPC","ENELAM","ENELCHILE","LTM","ANDINA-B","CENCOMALLS","MALLPLAZA","PARAUCO","IAM","AGUAS-A","ILC","VAPORES","SMU","QUINENCO","CCU","ENTEL","CAP"]:
              try:
                  u=f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.request.quote(tk+'.SN')}?range=5d&interval=5m"
                  j=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20))["chart"]["result"][0]
                  m=j["meta"]; ts=j["timestamp"]; cl=j["indicators"]["quote"][0]["close"]
                  days={}
                  for t,c in zip(ts,cl):
                      if c is None: continue
                      d=(datetime.datetime.utcfromtimestamp(t)-datetime.timedelta(hours=3)).strftime("%m-%d")
                      days.setdefault(d,[]).append(c)
                  ks=sorted(days); px=m.get('regularMarketPrice'); today=(datetime.datetime.utcnow()-datetime.timedelta(hours=3)).strftime("%m-%d")
                  prev=days[ks[-2]][-1] if ks[-1]==today else days[ks[-1]][-1]
                  out.append(f"{tk};{px};{(px/prev-1)*100:+.2f}%")
              except Exception as e: out.append(f"{tk};err")
          print("::notice::"+" | ".join(out))
          P

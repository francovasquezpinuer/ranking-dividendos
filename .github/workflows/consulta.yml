name: consulta
on: push
jobs:
  q:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[consulta]')
    steps:
      - run: |
          python3 - <<'P'
          import json, urllib.request, datetime
          H={"User-Agent":"Mozilla/5.0"}
          for tk in ["ENELAM","VAPORES","ILC","CENCOMALLS","IAM","^IPSA"]:
              s=urllib.parse.quote(tk if tk.startswith("^") else tk+".SN") if False else (tk if tk.startswith("^") else tk+".SN")
              try:
                  u=f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.request.quote(s)}?range=5d&interval=5m"
                  j=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20))["chart"]["result"][0]
                  m=j["meta"]; ts=j["timestamp"]; cl=j["indicators"]["quote"][0]["close"]
                  days={}
                  for t,c in zip(ts,cl):
                      if c is None: continue
                      d=(datetime.datetime.utcfromtimestamp(t)-datetime.timedelta(hours=3)).strftime("%m-%d")
                      days.setdefault(d,[]).append(round(c,2))
                  rs=" | ".join(f"{d}: o{v[0]} lo{min(v)} hi{max(v)} c{v[-1]}" for d,v in days.items())
                  hora=(datetime.datetime.utcfromtimestamp(m["regularMarketTime"])-datetime.timedelta(hours=3)).strftime("%m-%d %H:%M")
                  print(f"::notice::{tk} px {m.get('regularMarketPrice')} @ {hora} vol {m.get('regularMarketVolume')} || {rs}")
              except Exception as e:
                  print(f"::notice::{tk} error {e}")
          P

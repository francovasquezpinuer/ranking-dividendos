name: Consulta puntual
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import sys, statistics, datetime; sys.path.insert(0, "scripts")
          from update import get_json, crumb
          crumb()
          for sym in ["VAPORES.SN", "ENELAM.SN", "CENCOMALLS.SN", "IAM.SN"]:
              j = get_json(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=5d&interval=5m")
              r = j["chart"]["result"][0]; q = r["indicators"]["quote"][0]; m = r["meta"]
              pts = [(datetime.datetime.utcfromtimestamp(t - 3*3600).strftime("%d %H:%M"), c, v) for t, c, v in zip(r.get("timestamp") or [], q.get("close") or [], q.get("volume") or []) if c]
              byday = {}
              for d, c, v in pts: byday.setdefault(d[:2], []).append((d[3:], c, v or 0))
              res = " ; ".join(f"dia {k}: n{len(x)} min {min(c for _,c,_ in x):.2f} max {max(c for _,c,_ in x):.2f} ult {x[-1][1]:.2f} ({x[-1][0]}) vol {sum(v for *_,v in x)}" for k, x in byday.items())
              t = m.get("regularMarketTime"); ts = datetime.datetime.utcfromtimestamp(t - 3*3600).strftime("%Y-%m-%d %H:%M") if t else None
              print(f"::notice::{sym} precio {m.get('regularMarketPrice')} a las {ts} | cierre ant {m.get('chartPreviousClose')} | dia {m.get('regularMarketDayLow')}-{m.get('regularMarketDayHigh')} vol {m.get('regularMarketVolume')} | {res}")
          P

name: Consulta puntual
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import sys, statistics, datetime; sys.path.insert(0, "scripts")
          from update import get_json, crumb
          crumb()
          def serie(sym, rng, itv):
              r = get_json(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range={rng}&interval={itv}")["chart"]["result"][0]
              return r, {datetime.datetime.utcfromtimestamp(t).strftime("%Y-%m"): c for t, c in zip(r["timestamp"], r["indicators"]["quote"][0]["close"]) if c}
          _, v = serie("VAPORES.SN", "5y", "1mo"); _, h = serie("HLAG.DE", "5y", "1mo"); _, fx = serie("EURCLP=X", "5y", "1mo")
          ms = sorted(set(v) & set(h) & set(fx))
          hc = {m: h[m] * fx[m] for m in ms}
          def ret(s): return [s[ms[i]] / s[ms[i-1]] - 1 for i in range(1, len(ms))]
          rv, rh, rhc = ret(v), ret(h), ret(hc)
          c1 = statistics.correlation(rv, rh); c2 = statistics.correlation(rv, rhc)
          beta = statistics.covariance(rv, rhc) / statistics.variance(rhc)
          tot = lambda s: s[ms[-1]] / s[ms[0]] - 1
          print(f"::notice::Mensual {ms[0]}..{ms[-1]} n={len(rv)} | correlación VAPORES vs HLAG(EUR) {c1:.2f} | vs HLAG en pesos {c2:.2f} | beta {beta:.2f} | var total VAPORES {tot(v)*100:.0f}% HLAG(EUR) {tot(h)*100:.0f}% HLAG(CLP) {tot(hc)*100:.0f}%")
          ratio = [v[m] / hc[m] for m in ms]
          print(f"::notice::Razón VAPORES/HLAG(CLP) x1000: min {min(ratio)*1000:.3f} max {max(ratio)*1000:.3f} prom {statistics.mean(ratio)*1000:.3f} hoy {ratio[-1]*1000:.3f}")
          r, _ = serie("HLAG.DE", "5d", "1d"); m = r["meta"]
          print(f"::notice::HLAG hoy: precio {m.get('regularMarketPrice')} | cierre anterior {m.get('chartPreviousClose')} | hora {datetime.datetime.utcfromtimestamp(m.get('regularMarketTime')).strftime('%Y-%m-%d %H:%M')} UTC")
          P

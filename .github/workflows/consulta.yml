name: Consulta puntual
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import sys, datetime; sys.path.insert(0, "scripts")
          from update import get_json, crumb
          crumb()
          for sym in ["ENELAM.SN", "VAPORES.SN", "HLAG.DE"]:
              r = get_json(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=1d&interval=5m")["chart"]["result"][0]
              q = r["indicators"]["quote"][0]; m = r["meta"]
              pts = [(datetime.datetime.utcfromtimestamp(t - 3*3600).strftime("%H:%M"), c, v or 0) for t, c, v in zip(r.get("timestamp") or [], q["close"], q["volume"]) if c]
              print(f"::notice::{sym} último {m.get('regularMarketPrice')} ({datetime.datetime.utcfromtimestamp(m['regularMarketTime']-3*3600).strftime('%m-%d %H:%M')} Chile) día {m.get('regularMarketDayLow')}-{m.get('regularMarketDayHigh')} | " + " ".join(f"{h}={c:.2f}" for h, c, v in pts[-12:]))
          P

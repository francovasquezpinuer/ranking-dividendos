name: Consulta puntual
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import sys, datetime, json; sys.path.insert(0, "scripts")
          from update import get_json, crumb
          crumb(); out = {}
          tks = "BSANTANDER CHILE ANTARCHILE COPEC MINERA SOQUICOM SONDA PARAUCO ANDINA-B EMBONOR-B ENTEL QUINENCO SMU VAPORES MALLPLAZA AGUAS-A ENELAM ENELCHILE ENELGXCH IAM ^IPSA CENCOMALLS".split()
          for tk in tks:
              sym = tk if tk.startswith("^") else tk + ".SN"
              try:
                  r = get_json(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym.replace('^','%5E')}?range=5d&interval=5m")["chart"]["result"][0]
                  cl = r["indicators"]["quote"][0].get("close") or []; ts = r.get("timestamp") or []
                  days = {}
                  for t, c in zip(ts, cl):
                      if c: days.setdefault(datetime.datetime.utcfromtimestamp(t - 3*3600).strftime("%m-%d"), []).append((datetime.datetime.utcfromtimestamp(t - 3*3600).strftime("%H:%M"), c))
                  ks = sorted(days); hoy = ks[-1]; prev = ks[-2] if len(ks) > 1 else None
                  out[tk] = [hoy, days[hoy][-1][0], round(days[hoy][-1][1], 3), round(min(c for _, c in days[hoy]), 3), round(max(c for _, c in days[hoy]), 3), prev, round(days[prev][-1][1], 3) if prev else None, r["meta"].get("regularMarketPrice")]
              except Exception as e:
                  out[tk] = repr(e)
          s = json.dumps(out, separators=(",", ":"))
          for i in range(0, len(s), 900): print(f"::notice::P{i//900}|" + s[i:i+900])
          P

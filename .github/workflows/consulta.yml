name: consulta
on: push
jobs:
  q:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[consulta]')
    steps:
      - run: |
          python3 - <<'P' || true
          import json, urllib.request, datetime
          H={"User-Agent":"Mozilla/5.0"}
          for tk in ["IAM","AGUAS-A"]:
              try:
                  u=f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.request.quote(tk+'.SN')}?range=1mo&interval=1h&events=div"
                  j=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=20))["chart"]["result"][0]
                  m=j["meta"]; ts=j["timestamp"]; q=j["indicators"]["quote"][0]
                  days={}
                  for t,c,v in zip(ts,q["close"],q.get("volume") or [0]*len(ts)):
                      if c is None: continue
                      d=(datetime.datetime.utcfromtimestamp(t)-datetime.timedelta(hours=3)).strftime("%m-%d")
                      x=days.setdefault(d,[c,c,c,c,0]); x[1]=min(x[1],c); x[2]=max(x[2],c); x[3]=c; x[4]+=v or 0
                  dv=(j.get("events") or {}).get("dividends") or {}
                  dvs=[( (datetime.datetime.utcfromtimestamp(int(k))).strftime("%m-%d"), v["amount"]) for k,v in dv.items()]
                  hora=(datetime.datetime.utcfromtimestamp(m["regularMarketTime"])-datetime.timedelta(hours=3)).strftime("%m-%d %H:%M")
                  items=list(days.items())[-10:]
                  print(f"::notice::{tk} px {m.get('regularMarketPrice')} @ {hora} div {dvs} || "+" | ".join(f"{d}: lo{x[1]:.1f} hi{x[2]:.1f} c{x[3]:.1f} v{x[4]}" for d,x in items))
              except Exception as e: print(f"::notice::{tk} error {e}")
          P

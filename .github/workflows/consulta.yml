name: Consulta puntual
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  consulta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'P'
          import sys, statistics, datetime; sys.path.insert(0, "scripts")
          from update import get_json, crumb
          crumb()
          for sym in ["VAPORES.SN", "ENELAM.SN", "HLAG.DE"]:
              j = get_json(f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=3mo&interval=1d")
              r = j["chart"]["result"][0]; q = r["indicators"]["quote"][0]; m = r["meta"]
              rows = [(datetime.datetime.utcfromtimestamp(t).strftime("%m-%d"), o, h, l, c, v) for t, o, h, l, c, v in zip(r["timestamp"], q["open"], q["high"], q["low"], q["close"], q["volume"]) if c]
              last = rows[-15:]
              txt = " ; ".join(f"{d} o{o:.2f} h{h:.2f} l{l:.2f} c{c:.2f} v{v}" for d, o, h, l, c, v in last)
              cl = [x[4] for x in rows]; rng = statistics.mean((x[2]-x[3])/x[4] for x in rows[-20:] if x[2] and x[3])
              print(f"::notice::{sym} 52w {m.get('fiftyTwoWeekLow')}-{m.get('fiftyTwoWeekHigh')} | 3m min {min(cl):.2f} max {max(cl):.2f} | rango diario prom 20d {rng*100:.2f}% | {txt}")
          P
